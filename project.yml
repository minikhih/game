name: MiniKSPool
options:
  bundleIdPrefix: com.miniks
  deploymentTarget:
    iOS: "16.0"
targets:
  MiniKSPool:
    type: application
    platform: iOS
    sources:
      - path: MiniKSPool
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miniks.poolvip
        PRODUCT_NAME: MiniKS Pool VIP
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
